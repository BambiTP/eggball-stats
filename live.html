<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eggball Live Stats</title>
<style>
body { font-family: sans-serif; margin: 16px; line-height: 1.4; }
#page-tabs { margin-bottom: 12px; border-bottom: 2px solid #999; }
#page-tabs a { display: inline-block; padding: 6px 14px; border: 1px solid #999; border-bottom: none; text-decoration: none; color: #06c; }
#page-tabs a.current-tab { background: #ddd; color: #000; font-weight: bold; }
</style>
<style id="live-styles"></style>
</head><body>
<nav id="page-tabs">
  <a href="index.html">With and Against</a>
  <a href="scores.html">Final scores: TPM vs playeggball</a>
  <a href="live.html?page=games" id="games-tab">Games</a>
  <a href="live.html?page=players" id="players-tab">Players</a>
  <a href="live.html?page=best-and-worst" id="posters-tab">Best and worst</a>
</nav>
<div id="live-content"><p id="live-status">Loading the live stats…</p></div>
<script>
// The live stats are built every 10 minutes on a home computer and served through a Cloudflare tunnel.
// The tunnel's address changes when it restarts; the server writes the current one into this gist.
var gistAddress = 'https://api.github.com/gists/a591c82f75da2b09bdd7cb6b98b77db5';
var liveContent = document.getElementById('live-content');
// Short addresses: ?player=Bambi, ?game=<id>, ?page=games|players|best-and-worst.
// The old form ?p=<path on the live server> still works.
var PAGES = { 'games': 'games.html', 'players': 'players.html', 'best-and-worst': 'posters.html' };
var query = new URLSearchParams(location.search);
var livePath = query.get('p') ||
  (query.get('player') ? 'players/' + query.get('player') + '.html' :
   query.get('game') ? 'games/' + query.get('game') + '.html' :
   PAGES[query.get('page')] || 'games.html');

// only paths like games.html, games/<id>.html, players/<name>.html, posters.html
if (!/^((games|players)(\/[A-Za-z0-9_-]+)?|posters)\.html$/.test(livePath)) livePath = 'games.html';
document.getElementById(livePath.startsWith('players') ? 'players-tab' : livePath === 'posters.html' ? 'posters-tab' : 'games-tab').className = 'current-tab';

// the short address for a path on the live server
function shortAddress(path) {
  var m = path.match(/^(players|games)\/([A-Za-z0-9_-]+)\.html$/);
  if (m) return 'live.html?' + (m[1] === 'players' ? 'player=' : 'game=') + m[2];
  for (var name in PAGES) if (PAGES[name] === path) return 'live.html?page=' + name;
  return 'live.html?p=' + encodeURIComponent(path);
}

function showError(text) {
  liveContent.innerHTML = '';
  var p = document.createElement('p');
  p.textContent = text;
  liveContent.appendChild(p);
}

// turn a link inside a live page into a short live.html link on this site
function rewriteLink(link) {
  var href = link.getAttribute('href');
  if (!href || /^(https?:|#)/.test(href)) return;
  var resolved = new URL(href, 'https://x/' + livePath).pathname.slice(1);
  link.setAttribute('href', shortAddress(resolved));
}

function getServerAddress() {
  return fetch(gistAddress, { cache: 'no-store' })
    .then(function (response) { return response.json(); })
    .then(function (gist) {
      var live = JSON.parse(gist.files['eggball-live.json'].content);
      if (!live.url || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(live.url)) throw new Error('no address');
      return live.url;
    });
}

getServerAddress()
  .then(function (server) { return fetch(server + '/' + livePath, { cache: 'no-store' }); })
  .then(function (response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.text();
  })
  .then(function (text) {
    var page = new DOMParser().parseFromString(text, 'text/html');
    document.title = page.title;
    var style = page.querySelector('style');
    if (style) document.getElementById('live-styles').textContent = style.textContent;
    var nav = page.getElementById('page-tabs');
    if (nav) nav.remove();
    var scripts = Array.from(page.body.querySelectorAll('script'));
    scripts.forEach(function (s) { s.remove(); });
    page.body.querySelectorAll('a').forEach(rewriteLink);
    liveContent.innerHTML = page.body.innerHTML;
    // scripts added through innerHTML don't run, so add them again (sorting, minimum games filter)
    scripts.forEach(function (s) {
      var copy = document.createElement('script');
      copy.textContent = s.textContent;
      document.body.appendChild(copy);
    });
    window.scrollTo(0, 0);
  })
  .catch(function () {
    showError('The live stats server is offline right now (it runs on a home computer). Try again later.');
  });
</script>
</body></html>
